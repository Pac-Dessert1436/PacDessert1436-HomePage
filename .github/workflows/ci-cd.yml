name: Deploy to Alibaba Cloud Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nginx and prepare environment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          sudo apt update && sudo apt install -y nginx
          sudo mkdir -p /var/www/homepage
          sudo chown -R www-data:www-data /var/www/homepage
          sudo chmod -R 755 /var/www/homepage

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "./*"
        target: "/var/www/homepage"
        strip_components: 0
        overwrite: true
        rm: false

    - name: Configure Nginx and setup SSL
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Checking deployed files..."
          ls -la /var/www/homepage
          
          sudo chown -R www-data:www-data /var/www/homepage
          sudo chmod -R 755 /var/www/homepage
          
          sudo systemctl stop nginx
          
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo rm -f /etc/nginx/conf.d/default.conf
          
          sudo tee /etc/nginx/conf.d/homepage.conf > /dev/null <<EOF
          server {
              listen 80;
              listen [::]:80;
              
              root /var/www/homepage;
              index index.html index-en.html;
              
              server_name ${{ secrets.DOMAIN_NAME }} www.${{ secrets.DOMAIN_NAME }};
          }
          EOF
          
          sudo systemctl start nginx
          
          sudo apt update && sudo apt install -y certbot python3-certbot-nginx
          
          sudo certbot --nginx -d ${{ secrets.DOMAIN_NAME }} -d www.${{ secrets.DOMAIN_NAME }} --agree-tos --register-unsafely-without-email --redirect -n
          
          sudo systemctl restart nginx
          sudo systemctl enable nginx
          
          echo "=== Nginx Status ==="
          sudo systemctl status nginx --no-pager
          
          echo "=== Listening Ports ==="
          sudo netstat -tlnp | grep -E ":80|:443" || sudo ss -tlnp | grep -E ":80|:443"